<script>
var p=document.getElementById('p');
var ac,timer,step=0,nt=0,sp=60/126/4,nb,dl;
function noise(t,f,type,dur,g){var s=ac.createBufferSource();s.buffer=nb;var fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;var v=ac.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(v);v.connect(ac.destination);s.start(t);s.stop(t+dur+.05)}
function tone(t,f,type,dur,g,cut,out){var o=ac.createOscillator();o.type=type;o.frequency.value=f;var fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;var v=ac.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(fl);fl.connect(v);v.connect(ac.destination);if(out)v.connect(dl);o.start(t);o.stop(t+dur+.05)}
var ROOT=[49,49,49,58.27],CH=[[196,233.08,293.66],[196,233.08,293.66],[174.61,220,261.63],[196,233.08,293.66]];
function play(s,t){var i=s%16,b=Math.floor(s/16)%4;
if(i%4==0){var o=ac.createOscillator(),v=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);v.gain.setValueAtTime(1,t);v.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+.4)}
if(i==4||i==12)noise(t,1800,'bandpass',.12,.35);
if(i==7||i==11||i==15)tone(t,i==15?420:330,'sine',.09,.18,3000);
if(i%4==2)noise(t,7500,'highpass',.1,.22);if(i%2==1)noise(t,9000,'highpass',.03,i%4==3?.12:.07);
if(i==2||i==6||i==10||i==11||i==14)tone(t,ROOT[b]*(i==11?2:1),'sawtooth',.13,.4,380);
if(i==3||i==10)CH[b].forEach(function(f){tone(t,f,'square',.1,.035,900+(Math.floor(s/16)%8)*350,true)})}
function sched(){while(nt<ac.currentTime+.15){play(step,nt);nt+=sp;step++}}
function startAudio(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);var d=nb.getChannelData(0);for(var k=0;k<d.length;k++)d[k]=Math.random()*2-1;dl=ac.createDelay();dl.delayTime.value=sp*3;var fb=ac.createGain();fb.gain.value=.35;dl.connect(fb);fb.connect(dl);dl.connect(ac.destination)}ac.resume();step=0;nt=ac.currentTime+.1;clearInterval(timer);timer=setInterval(sched,25)}catch(e){}}
p.addEventListener('click',function(){p.classList.remove('go');void p.offsetWidth;p.classList.add('go');startAudio()});
document.addEventListener('visibilitychange',function(){if(!ac)return;if(document.hidden)ac.suspend();else ac.resume()});
